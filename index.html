<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('votewatch-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1427" />
    <meta
      name="description"
      content="Explore South Africa's local government elections. Interactive maps, party results, seats and council coverage."
    />
    <title>VoteWatch | South Africa</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
